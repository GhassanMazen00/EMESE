<!doctype html>
<html lang="ar-EG" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>أسماء بالجملة | EMESE</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f1eee8">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <script>
    (function () {
      var d = document.documentElement, t = null, l = null;
      try { t = localStorage.getItem('emese-theme'); l = localStorage.getItem('emese-lang'); } catch (e) {}
      d.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      if (l === 'en') { d.setAttribute('lang', 'en'); d.setAttribute('dir', 'ltr'); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body class="page">
  <a class="skip" href="#main" data-i18n="skip">اقفز للمحتوى</a>
  <div id="header"></div>
  <main id="main" class="page-main">
    <section class="page-card page-wide">
      <h1 data-i18n="bk.title">أسماء بالجملة</h1>
      <p class="sub" data-i18n="bk.sub">لكل اسم في القايمة: صورة موكب للعميل، وملف طباعة شفاف للمكنة. كله بيتعمل على جهازك.</p>

      <div class="bk-grid">
        <form id="bkForm" class="bk-form" novalidate>
          <label class="field"><span data-i18n="bk.names">الأسماء (كل اسم في سطر)</span>
            <textarea id="bkNames" rows="8" data-i18n-attr="placeholder:bk.namesPh" placeholder="أحمد سمير&#10;منى علي&#10;Omar Khaled"></textarea><small class="err"></small></label>
          <label class="field"><span data-i18n="bk.csv">أو ارفع شيت CSV (أول عمود)</span><input type="file" id="bkCsv" accept=".csv,text/csv,text/plain"></label>
          <div class="grid2">
            <label class="field"><span data-i18n="bk.product">المنتج</span><select id="bkProduct"></select></label>
            <label class="field"><span data-i18n="bk.method">الطريقة</span><select id="bkMethod"></select></label>
            <label class="field"><span data-i18n="bk.color">لون المنتج</span><select id="bkColor"></select></label>
            <label class="field"><span data-i18n="bk.ink">لون الخط</span><select id="bkInk"></select></label>
            <label class="field"><span data-i18n="bk.font">الخط</span><select id="bkFont"></select></label>
            <label class="field"><span data-i18n="bk.size">الحجم</span><input type="range" id="bkSize" min="0.1" max="0.9" step="0.01" value="0.4"></label>
          </div>
          <label class="check"><input type="checkbox" id="bkLogo"> <span data-i18n="bk.withLogo">حط اللوجو فوق الاسم</span></label>
          <p class="form-error" role="alert" id="bkError" hidden></p>
          <div class="report-actions">
            <button type="submit" class="btn btn-ink" id="bkGo"><span data-i18n="bk.make">اعمل الملفات</span></button>
            <span class="brand-status" id="bkStatus" role="status" aria-live="polite"></span>
          </div>
        </form>
        <div class="bk-preview">
          <canvas id="bkCanvas" width="1200" height="1200" aria-label="Preview" data-i18n-attr="aria-label:bk.preview"></canvas>
          <p class="hint" data-i18n="bk.previewHint">المعاينة للاسم الأول.</p>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="js/bulk.js"></script>
</body>
</html>
