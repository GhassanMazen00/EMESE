<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@500;700&family=IBM+Plex+Mono:wght@500&family=DM+Serif+Display&display=block" rel="stylesheet">
<style>
:root{--c:#00a3e0;--m:#e6007e;--y:#ffe500;--ink:#121313}
*{box-sizing:border-box;margin:0}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--ink)}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--ink);font-family:"IBM Plex Sans Arabic",sans-serif;color:#fff}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:4.4vw 4.4vw}
.layer{position:absolute;inset:0;opacity:0;will-change:opacity,transform}
.photo{position:absolute;inset:0;overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 45%}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,19,19,.55) 0%,rgba(18,19,19,0) 28%,rgba(18,19,19,0) 52%,rgba(18,19,19,.92) 100%)}
.txt{position:absolute;inset-inline:7vw;bottom:var(--tb,13vh);text-align:right}
.h{font:800 var(--hs,8.6vw)/1.35 Alexandria,sans-serif;letter-spacing:0}
.h .dot,.dot{color:var(--m)}
.sub{margin-top:1.4vh;font:500 var(--ss,4.2vw)/1.6 "IBM Plex Sans Arabic";color:rgba(255,255,255,.82)}
.chip{display:inline-block;font:500 3.1vw/1 "IBM Plex Mono",monospace;padding:1.1vw 1.8vw;color:#141414;margin-bottom:1.6vh}
.logo{font:400 var(--ls,19vw)/1 "DM Serif Display",serif;direction:ltr;display:inline-flex;align-items:baseline;color:#fff}
.logo i{display:inline-block;width:.16em;height:.16em;border-radius:50%;background:var(--m);margin-inline-start:.04em}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8vw}
.reg{display:inline-block;width:3.4vw;height:3.4vw;border:.45vw solid var(--rc);border-radius:50%;position:relative;margin:0 1.6vw}
.reg::before,.reg::after{content:"";position:absolute;background:var(--rc)}
.reg::before{left:50%;top:-1.1vw;bottom:-1.1vw;width:.45vw;transform:translateX(-50%)}
.reg::after{top:50%;left:-1.1vw;right:-1.1vw;height:.45vw;transform:translateY(-50%)}
.tag{position:absolute;background:rgba(255,255,255,.95);color:#141414;border:.25vw solid #141414;padding:1.2vw 2vw;display:grid;gap:.4vw;text-align:right}
.tag b{font:800 3.6vw/1.2 Alexandria}
.tag span{font:500 2.7vw/1.2 "IBM Plex Mono","IBM Plex Sans Arabic"}
.pin{position:absolute;width:3vw;height:3vw;border-radius:50%;border:.45vw solid #141414;background:radial-gradient(circle,var(--m) 0 .6vw,#fff .7vw);transform:translate(-50%,-50%)}
svg.ld{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
svg.ld path{fill:none;stroke:#141414;stroke-width:.35vw;filter:drop-shadow(0 0 .3vw #fff)}
.bar{position:absolute;left:0;right:0;bottom:0;height:.8vh;display:flex;direction:ltr}
.bar i{height:100%}
.wa{display:inline-flex;align-items:center;gap:2vw;margin-top:4vh;padding:2.2vw 4vw;border:.3vw solid #fff;font:500 5.4vw/1 "IBM Plex Mono";direction:ltr}
.wa svg{width:6vw;height:6vw;color:#25d366}
.url{margin-top:2.4vh;font:500 4.4vw/1 "IBM Plex Mono";color:rgba(255,255,255,.75);direction:ltr}
.approve{position:absolute;left:8vw;top:12vh;display:flex;align-items:center;gap:2vw;background:#fff;color:#141414;padding:2vw 3vw;font:800 3.8vw/1 Alexandria}
.approve svg{width:5vw;height:5vw}
.tiles{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:1vw}
.tiles .photo{position:relative}
.g4{position:absolute;left:5vw;right:5vw;top:var(--gt,14vh);display:grid;grid-template-columns:1fr 1fr;gap:2.4vw}
.cell{position:relative;aspect-ratio:1;overflow:hidden;opacity:0;outline:.5vw solid transparent;transition:outline-color .3s}
.cell .photo{position:absolute;inset:0}
.cell.on{outline-color:#fff}
.cell:not(.on) img{filter:brightness(.7) saturate(.85)}
.cell img{transition:filter .5s}
.clab{position:absolute;right:2vw;bottom:2vw;display:inline-flex;align-items:center;gap:1.4vw;background:rgba(18,19,19,.82);padding:1vw 1.6vw;font:700 3.2vw/1.2 Alexandria}
.clab b{font-weight:500;font-size:2.6vw;background:var(--m);color:#141414;padding:.4vw 1vw}
.gtxt{bottom:var(--gtb,13vh)}
</style></head><body><div id="stage"><div class="grid"></div></div>
<script>
const W = innerWidth, H = innerHeight, tall = H / W > 1.5;
const S = document.getElementById('stage');
const A = 'assets/';
const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
const clamp = (x) => Math.min(Math.max(x, 0), 1);
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); const n = d.firstChild; S.appendChild(n); return n; }
// a scene: [start, end, node, onRender(t local seconds, node, dur)]
const scenes = [];
function scene(a, b, html, fx) { const n = el(`<div class="layer">${html}</div>`); scenes.push({ a, b, n, fx: fx || (() => {}) }); return n; }
const photo = (src, pos = '50% 50%') => `<div class="photo"><img src="${A}${src}" style="object-position:${pos}"></div><div class="shade"></div>`;
const kb = (n, t, d, z0 = 1.12, z1 = 1.0, dx = 0) => n.querySelectorAll('.photo img').forEach(i => { const k = ease(t / d); i.style.transform = `scale(${z0 + (z1 - z0) * k}) translateX(${dx * k}%)`; });
const rise = (node, t, delay = 0, dist = 3) => { if (!node) return; const k = ease((t - delay) / .55); node.style.opacity = k; node.style.transform = `translateY(${(1 - k) * dist}vh)`; node.style.clipPath = `inset(0 0 ${(1 - k) * 100}% 0)`; };
const wipe = (node, t, delay = 0) => { if (!node) return; const k = ease((t - delay) / .6); node.style.clipPath = `inset(0 0 0 ${(1 - k) * 100}%)`; node.style.opacity = k > 0 ? 1 : 0; };
const tb = tall ? '14vh' : '9vh';
S.style.setProperty('--tb', tb);
if (!tall) { S.style.setProperty('--gt', '4vh'); S.style.setProperty('--gtb', '4vh'); S.style.setProperty('--hs', '6.6vw'); S.style.setProperty('--ss', '3.4vw'); S.style.setProperty('--ls', '15vw'); }

// voice timings (original recording) shifted by the pauses added between sections
const GAPS = [[2.00, .3], [5.00, .6], [11.25, .6], [16.92, .5], [22.05, .7]];
const sh = (t) => t + GAPS.reduce((s, [p, g]) => s + (t > p ? g : 0), 0);
const grid = (cells) => `<div class="g4">${cells.map((c, i) => `<div class="cell" data-i="${i}"><div class="photo"><img src="${A}${c[0]}"></div><span class="clab"><b class="mono">0${i + 1}</b>${c[1]}</span></div>`).join('')}</div>`;
function gridFx(n, t, times, d) {
  const cells = n.querySelectorAll('.cell');
  cells.forEach((c, i) => {
    const k = ease((t - times[i]) / .7);
    c.style.opacity = k; c.style.transform = `scale(${.92 + .08 * k})`;
    const active = t >= times[i] && (i === cells.length - 1 || t < times[i + 1]);
    c.classList.toggle('on', active);
    const img = c.querySelector('img'); img.style.transform = `scale(${1.12 - .1 * ease((t - times[i]) / 3)})`;
  });
}
// 1. hook
scene(0, sh(2.0), `<div class="center"><div class="logo l1">EMESE<i></i></div><div class="h q1" style="margin-top:5vh;font-size:${tall ? 8 : 6}vw">عندك شركة، مطعم،<br>أو براند؟</div></div>`,
  (t, n) => { const l = n.querySelector('.l1'); const k = ease(t / 1.0); l.style.opacity = k; l.style.transform = `scale(${1.12 - .12 * k})`; rise(n.querySelector('.q1'), t, .45); });
// 2. "everything you need, with your logo": one slow push-in, a long dissolve to a second product
scene(sh(2.0), sh(3.55), photo('products/polo.webp'), (t, n, d) => kb(n, t, d + .6, 1.16, 1.04));
scene(sh(3.55), sh(5.0), photo('products/notebook.webp'), (t, n, d) => kb(n, t, d + .6, 1.14, 1.02));
scene(sh(2.0), sh(5.0), `<div class="txt"><div class="h a1">كل حاجة محتاجها…</div><div class="h a2">باللوجو بتاعك<span class="dot">.</span></div></div>`,
  (t, n) => { rise(n.querySelector('.a1'), t, .15); rise(n.querySelector('.a2'), t, sh(3.68) - sh(2.0)); });
// 3. the four groups build up in one grid, the spoken one lit
const G = [['products/polo.webp', 'يونيفورم لفريقك'], ['products/chef.webp', 'لبس للمطبخ والصالة'], ['products/giftset.webp', 'هدايا لعملائك'], ['products/featherflag.webp', 'للإيفنتات']];
const gT = [5.20, 6.58, 8.26, 9.55].map(x => sh(x) - sh(5.0));
scene(sh(5.0), sh(11.25), `${grid(G)}<div class="txt gtxt"><div class="h gh"></div></div>`,
  (t, n, d) => { gridFx(n, t, gT, d); const heads = ['يونيفورم لفريقك،', 'لبس للمطبخ والصالة،', 'هدايا لعملائك،', 'وكل اللي تحتاجه للإيفنتات.'];
    let i = gT.filter(x => t >= x - .05).length - 1; i = Math.max(0, i); const h = n.querySelector('.gh'); if (h.dataset.i != i) { h.dataset.i = i; h.textContent = heads[i]; h.dataset.t0 = t; }
    rise(h, t - (+h.dataset.t0 || 0), 0, 1.5); });
// 4. machines: the embroidery floor, then the four techniques build in a grid
scene(sh(11.25), sh(13.5), `${photo('machines/stitch-1.webp')}<div class="txt"><div class="h m1">وكل ده بيتعمل<br>عندنا<span class="dot">.</span></div></div>`,
  (t, n, d) => { kb(n, t, d + .8, 1.16, 1.0, -2); rise(n.querySelector('.m1'), t, .3); });
const M = [['machines/stitch-2.webp', 'تطريز'], ['machines/dtf-2.webp', 'طباعة'], ['machines/laser-2.webp', 'حفر بالليزر'], ['machines/sewing-2.webp', 'تصنيع يونيفورم']];
const mT = [13.60, 14.30, 15.43, 16.05].map(x => sh(x) - sh(13.5));
scene(sh(13.5), sh(16.92), `${grid(M)}<div class="txt gtxt"><div class="h gh"></div></div>`,
  (t, n, d) => { gridFx(n, t, mT, d); const heads = ['تطريز،', 'طباعة،', 'حفر بالليزر،', 'وتصنيع يونيفورم كامل.'];
    let i = Math.max(0, mT.filter(x => t >= x - .05).length - 1); const h = n.querySelector('.gh'); if (h.dataset.i != i) { h.dataset.i = i; h.textContent = heads[i]; h.dataset.t0 = t; }
    rise(h, t - (+h.dataset.t0 || 0), 0, 1.5); });
// 5. one piece to a whole company, then approval
scene(sh(16.92), sh(18.9), `${photo('machines/sewing-3.webp')}<div class="txt"><div class="h p1">من قطعة واحدة…</div><div class="h p2">لشركة كاملة<span class="dot">.</span></div></div>`,
  (t, n, d) => { kb(n, t, d + .6, 1.02, 1.14); rise(n.querySelector('.p1'), t, .2); rise(n.querySelector('.p2'), t, sh(18.25) - sh(16.92)); });
scene(sh(18.9), sh(22.05), `${photo('products/hoodie.webp')}<div class="approve"><svg viewBox="0 0 24 24" fill="none" stroke="#0a7a43" stroke-width="3"><path d="M4 12.5l5 5L20 6.5"/></svg>موافق</div>
  <div class="txt"><div class="h r1" style="font-size:${tall ? 6.6 : 5.2}vw">وبنبعتلك التصميم<br>توافق عليه قبل ما نبدأ<span class="dot">.</span></div></div>`,
  (t, n, d) => { kb(n, t, d + .6, 1.12, 1.0); rise(n.querySelector('.r1'), t, .1); const ap = n.querySelector('.approve'); const k = ease((t - 1.6) / .5); ap.style.opacity = k; ap.style.transform = `scale(${.7 + .3 * k}) rotate(${-6 * (1 - k)}deg)`; });
// 6. outro
const o0 = sh(22.05);
scene(o0, 99, `<div class="center"><div class="logo o1">EMESE<i></i></div>
  <div class="h o2" style="margin-top:3vh;font-size:${tall ? 7.6 : 5.8}vw">إنت تتخيّل،<br>وإحنا ننفّذ<span class="dot">.</span></div>
  <div class="o5" style="margin-top:3vh"><i class="reg" style="--rc:var(--c)"></i><i class="reg" style="--rc:var(--m)"></i><i class="reg" style="--rc:#e3c900"></i></div>
  <div class="wa o3"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a9.9 9.9 0 0 0-8.5 15l-1.4 5 5.2-1.4A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>0128 050 9299</div>
  <div class="url o4">emese-eg.com</div></div>`,
  (t, n) => { const l = n.querySelector('.o1'); const k = ease((t - .15) / .9); l.style.opacity = k; l.style.transform = `scale(${1.15 - .15 * k})`;
    rise(n.querySelector('.o2'), t, sh(23.37) - o0); rise(n.querySelector('.o5'), t, sh(23.37) - o0 + .6, 1); rise(n.querySelector('.o3'), t, sh(25.10) - o0); rise(n.querySelector('.o4'), t, sh(26.04) - o0); });
// CMY progress bar
const bar = el(`<div class="bar"><i style="background:var(--c)"></i><i style="background:var(--m)"></i><i style="background:var(--y)"></i></div>`);
const FADE = .45, END = 33.5;
window.render = (T) => {
  for (const s of scenes) {
    const on = T >= s.a - FADE && T < s.b + FADE;
    if (!on) { s.n.style.opacity = 0; s.n.style.display = 'none'; continue; }
    s.n.style.display = '';
    const fin = clamp((T - (s.a - FADE)) / FADE), fout = s.b > 90 ? 1 : clamp((s.b + FADE - T) / FADE);
    s.n.style.opacity = Math.min(fin, fout);
    s.fx(T - s.a, s.n, s.b - s.a);
  }
  const p = T / END; bar.querySelectorAll('i').forEach((i, k) => { i.style.width = (clamp(p * 3 - k) * 100 / 3) + '%'; });
  const out = clamp((T - (END - .6)) / .6); S.style.opacity = 1 - out;
};
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]);
</script></body></html>
